          layout: 'vertical',
          color:  'gold',
          shape:  'rect',
          label:  'paypal'
        },
        createOrder: function(data, actions) {
          if (!currencySelect.value) {
            alert("Please select a currency from the list before paying.");
            return Promise.reject(new Error("No currency selected"));
          }

          const selectedData = JSON.parse(currencySelect.value);

          return actions.order.create({
            purchase_units: [{
              amount: {
                value: '0.99',
                currency_code: 'GBP'
              },
              description: `Add Custom Currency: ${selectedData.code} - ${selectedData.name}`
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(async function(details) {
            const selectedData = JSON.parse(currencySelect.value);
            const userId = getCognitoUserId();

            // 1. Record purchase in AWS DynamoDB via API Gateway
            try {
              await fetch('https://teiit1vla3.execute-api.eu-west-2.amazonaws.com/prod/purchases', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  userId: userId,
                  currencyCode: selectedData.code,
                  currencyName: selectedData.name,
                  country: selectedData.country
                })
              });
            } catch (err) {
              console.error("Failed to log purchase to database:", err);
            }

            // 2. Save custom currency to LocalStorage
            const savedCurrencies = JSON.parse(localStorage.getItem("customCurrencies")) || {};
            savedCurrencies[selectedData.code] = `${selectedData.country} (${selectedData.name})`;
            localStorage.setItem("customCurrencies", JSON.stringify(savedCurrencies));

            // 3. Set active currency on home page
            localStorage.setItem("fromCurrency", selectedData.code);

            // 4. Redirect to Home
            window.location.href = "index.html";
          });
        },
