<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Holiday Currency Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .converter {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      width: 440px;
      text-align: center;
      overflow-y: auto;
      max-height: 95vh;
    }
    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .top-bar select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }
    .title-box {
      background-color: #007bff;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }
    select, input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    label { font-weight: bold; display: block; text-align: left; margin-top: 10px; }
    .contact-intro { font-size: 14px; color: #555; margin-bottom: 15px; text-align: left; }
    .submit-btn { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background-color 0.2s ease; }
    .submit-btn:hover { background-color: #0056b3; }
    .gallery-footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eaeaea; text-align: center; font-size: 0.9em; color: #555; }
  </style>
</head>
<body>

  <div class="converter">

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <select class="lang-picker" id="langPicker" aria-label="Select language" onchange="setLang(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
      <select id="titleDropdown" onchange="navigateToPage(this.value)">
        <option value="contact.html"      data-i18n-nav="navContact"     selected>✉️ Contact us</option>
        <option value="index.html"        data-i18n-nav="navHome">🏠 Home</option>
        <option value="add-currency.html" data-i18n-nav="navAddCurrency">➕ Add Currency (£0.99)</option>
        <option value="privacy.html"      data-i18n-nav="navPrivacy">🔒 Privacy Policy</option>
        <option value="delete-account.html" data-i18n-nav="navDeleteAccount">🗑️ Delete Account</option>
        <option value="signout"           data-i18n-nav="navSignOut">🚪 Sign Out</option>
      </select>
    </div>

    <div class="title-box" data-i18n="contactTitle">Contact Us</div>

    <div class="contact-intro">
      <p data-i18n="contactIntro">Have questions about the holiday currency converter or adding custom currencies? Send us a message below.</p>
    </div>

    <form id="contact-form">
      <label for="name"><b data-i18n="nameLabel">Name:</b></label>
      <input type="text" id="name" name="name" data-i18n-placeholder="namePlaceholder" placeholder="Your name" required>

      <label for="email"><b data-i18n="emailLabel">Email:</b></label>
      <input type="email" id="email" name="email" data-i18n-placeholder="emailPlaceholder" placeholder="Your email address" required>

      <label for="message"><b data-i18n="messageLabel">Message:</b></label>
      <textarea id="message" name="message" rows="4" data-i18n-placeholder="messagePlaceholder" placeholder="How can we help?" required></textarea>

      <button type="submit" class="submit-btn" data-i18n="sendBtn">✉️ Send Message</button>
    </form>

    <footer class="gallery-footer">
      <span data-i18n="footer">&copy; 2026 S Allan. All rights reserved.</span>
    </footer>
  </div>

  <script>
    const TRANSLATIONS = {
      en: { contactTitle:'Contact Us', contactIntro:'Have questions about the holiday currency converter or adding custom currencies? Send us a message below.', nameLabel:'Name:', namePlaceholder:'Your name', emailLabel:'Email:', emailPlaceholder:'Your email address', messageLabel:'Message:', messagePlaceholder:'How can we help?', sendBtn:'✉️ Send Message', footer:'© 2026 S Allan. All rights reserved.', navHome:'🏠 Home', navAddCurrency:'➕ Add Currency (£0.99)', navContact:'✉️ Contact us', navPrivacy:'🔒 Privacy Policy', navDeleteAccount:'🗑️ Delete Account', navSignOut:'🚪 Sign Out', messageSent:'Thank You! Message sent successfully!', messageFailed:'Failed to send message. Please try again.', connectionError:'Error connecting to the service.' },
      fr: { contactTitle:'Nous contacter', contactIntro:'Des questions sur le convertisseur ou l\'ajout de devises ? Envoyez-nous un message.', nameLabel:'Nom :', namePlaceholder:'Votre nom', emailLabel:'E-mail :', emailPlaceholder:'Votre adresse e-mail', messageLabel:'Message :', messagePlaceholder:'Comment pouvons-nous vous aider ?', sendBtn:'✉️ Envoyer le message', footer:'© 2026 S Allan. Tous droits réservés.', navHome:'🏠 Accueil', navAddCurrency:'➕ Ajouter une devise (0,99 £)', navContact:'✉️ Nous contacter', navPrivacy:'🔒 Politique de confidentialité', navDeleteAccount:'🗑️ Supprimer le compte', navSignOut:'🚪 Se déconnecter', messageSent:'Merci ! Message envoyé avec succès !', messageFailed:'Échec de l\'envoi. Veuillez réessayer.', connectionError:'Erreur de connexion au service.' },
      es: { contactTitle:'Contáctenos', contactIntro:'¿Tiene preguntas sobre el conversor o la adición de divisas? Envíenos un mensaje.', nameLabel:'Nombre:', namePlaceholder:'Su nombre', emailLabel:'Correo electrónico:', emailPlaceholder:'Su dirección de correo', messageLabel:'Mensaje:', messagePlaceholder:'¿En qué podemos ayudarle?', sendBtn:'✉️ Enviar mensaje', footer:'© 2026 S Allan. Todos los derechos reservados.', navHome:'🏠 Inicio', navAddCurrency:'➕ Añadir divisa (£0,99)', navContact:'✉️ Contáctenos', navPrivacy:'🔒 Política de privacidad', navDeleteAccount:'🗑️ Eliminar cuenta', navSignOut:'🚪 Cerrar sesión', messageSent:'¡Gracias! ¡Mensaje enviado con éxito!', messageFailed:'Error al enviar. Inténtelo de nuevo.', connectionError:'Error al conectar con el servicio.' },
      de: { contactTitle:'Kontakt', contactIntro:'Haben Sie Fragen zum Währungsrechner oder zum Hinzufügen von Währungen? Senden Sie uns eine Nachricht.', nameLabel:'Name:', namePlaceholder:'Ihr Name', emailLabel:'E-Mail:', emailPlaceholder:'Ihre E-Mail-Adresse', messageLabel:'Nachricht:', messagePlaceholder:'Wie können wir Ihnen helfen?', sendBtn:'✉️ Nachricht senden', footer:'© 2026 S Allan. Alle Rechte vorbehalten.', navHome:'🏠 Startseite', navAddCurrency:'➕ Währung hinzufügen (£0,99)', navContact:'✉️ Kontakt', navPrivacy:'🔒 Datenschutzrichtlinie', navDeleteAccount:'🗑️ Konto löschen', navSignOut:'🚪 Abmelden', messageSent:'Vielen Dank! Nachricht erfolgreich gesendet!', messageFailed:'Senden fehlgeschlagen. Bitte versuchen Sie es erneut.', connectionError:'Verbindungsfehler zum Dienst.' },
      it: { contactTitle:'Contattaci', contactIntro:'Hai domande sul convertitore o sull\'aggiunta di valute personalizzate? Inviaci un messaggio.', nameLabel:'Nome:', namePlaceholder:'Il tuo nome', emailLabel:'Email:', emailPlaceholder:'Il tuo indirizzo email', messageLabel:'Messaggio:', messagePlaceholder:'Come possiamo aiutarti?', sendBtn:'✉️ Invia messaggio', footer:'© 2026 S Allan. Tutti i diritti riservati.', navHome:'🏠 Home', navAddCurrency:'➕ Aggiungi valuta (£0,99)', navContact:'✉️ Contattaci', navPrivacy:'🔒 Informativa sulla privacy', navDeleteAccount:'🗑️ Elimina account', navSignOut:'🚪 Esci', messageSent:'Grazie! Messaggio inviato con successo!', messageFailed:'Invio fallito. Riprova.', connectionError:'Errore di connessione al servizio.' }
    };

    function getLang() { return localStorage.getItem('appLang') || 'en'; }
    function t(key) { const tbl = TRANSLATIONS[getLang()] || TRANSLATIONS.en; return tbl[key] !== undefined ? tbl[key] : (TRANSLATIONS.en[key] || key); }
    function applyTranslations(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (tbl[k] !== undefined) el.innerHTML = tbl[k]; });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (tbl[k] !== undefined) el.placeholder = tbl[k]; });
    }
    function _rebuildNavDropdown(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      const dd = document.getElementById('titleDropdown');
      if (!dd) return;
      const cur = dd.value;
      dd.querySelectorAll('option[data-i18n-nav]').forEach(opt => { const k = opt.getAttribute('data-i18n-nav'); if (tbl[k] !== undefined) opt.textContent = tbl[k]; });
      dd.value = cur;
    }
    function setLang(code) {
      localStorage.setItem('appLang', code);
      document.documentElement.lang = code;
      applyTranslations(code);
      document.querySelectorAll('.lang-picker').forEach(s => { s.value = code; });
      _rebuildNavDropdown(code);
    }

    (function() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.getElementById('langPicker').value = lang;
      applyTranslations(lang);
      _rebuildNavDropdown(lang);
    })();

    function navigateToPage(url) {
      if (url === 'signout') { handleSignOut(); return; }
      if (url) window.location.href = url;
    }
    function handleSignOut() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.')) keysToRemove.push(key);
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem('cognitoIdToken');
      localStorage.removeItem('cognitoAccessToken');
      window.location.href = 'signin.html';
    }

    const API_BASE = 'https://teiit1vla3.execute-api.eu-west-2.amazonaws.com/prod';
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };
      try {
        const response = await fetch(`${API_BASE}/contact`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        if (response.ok) {
          alert(t('messageSent'));
          document.getElementById('contact-form').reset();
        } else {
          alert(t('messageFailed'));
        }
      } catch (err) {
        alert(t('connectionError'));
      }
    });
  </script>
</body>
</html>
