<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Register - Holiday Currency Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      width: 440px;
      max-width: 100%;
      text-align: center;
      overflow-y: auto;
      max-height: 95vh;
      box-sizing: border-box;
    }
    /* ── Top bar: language left, nav right ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .top-bar select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }
    .title-box {
      background-color: #007bff;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }
    .tab-row {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #007bff;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 0;
      margin: 0;
      cursor: pointer;
      background: #fff;
      color: #007bff;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active { background: #007bff; color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    label { font-weight: bold; display: block; text-align: left; margin-top: 10px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s ease; }
    button:hover { background-color: #0056b3; }
    .status-msg { padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 15px; display: none; text-align: left; }
    .status-msg.error   { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <select class="lang-picker" id="langPicker" aria-label="Select language" onchange="setLang(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
      <select id="titleDropdown" onchange="navigateToPage(this.value)">
        <option value="signin.html"  data-i18n-nav="navSignInPage" selected>🔑 Sign In / Register</option>
        <option value="index.html"   data-i18n-nav="navHome">🏠 Home</option>
        <option value="contact.html" data-i18n-nav="navContact">✉️ Contact us</option>
        <option value="privacy.html" data-i18n-nav="navPrivacy">🔒 Privacy Policy</option>
        <option value="signout"      data-i18n-nav="navSignOut">🚪 Sign Out</option>
      </select>
    </div>

    <div class="title-box" data-i18n="appTitle">Holiday Currency Converter</div>

    <div class="tab-row" role="tablist">
      <button class="tab-btn active" id="tabSignIn" role="tab" aria-selected="true"
              aria-controls="panelSignIn" onclick="switchTab('signin')"
              data-i18n="tabSignIn">Sign In</button>
      <button class="tab-btn" id="tabRegister" role="tab" aria-selected="false"
              aria-controls="panelRegister" onclick="switchTab('register')"
              data-i18n="tabRegister">Register</button>
    </div>

    <div id="statusMessage" class="status-msg"></div>

    <!-- Sign In panel -->
    <div id="panelSignIn" class="tab-panel active" role="tabpanel" aria-labelledby="tabSignIn">
      <form id="signInForm" onsubmit="handleSignIn(event)">
        <label for="siEmail" data-i18n="emailLabel">Email Address</label>
        <input type="email" id="siEmail" data-i18n-placeholder="emailPlaceholder"
               placeholder="name@example.com" required>

        <label for="siPassword" data-i18n="passwordLabel">Password</label>
        <div style="position:relative;">
          <input type="password" id="siPassword" data-i18n-placeholder="signInPasswordPlaceholder"
                 placeholder="Enter password" required style="padding-right:44px;">
          <button type="button" onclick="togglePassword('siPassword','siEyeBtn')" id="siEyeBtn"
                  aria-label="Show password"
                  style="position:absolute;right:0;top:0;height:100%;width:42px;background:none;
                         border:none;cursor:pointer;font-size:18px;color:#666;display:flex;
                         align-items:center;justify-content:center;margin:0;padding:0;">👁</button>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;">
          <input type="checkbox" id="rememberEmail" style="width:18px;height:18px;margin:0;cursor:pointer;flex-shrink:0;">
          <label for="rememberEmail" style="margin:0;font-weight:normal;font-size:14px;cursor:pointer;"
                 data-i18n="rememberEmail">Remember my email address</label>
        </div>

        <button type="submit" data-i18n="signInBtn">Sign In</button>
      </form>
    </div>

    <!-- Register panel -->
    <div id="panelRegister" class="tab-panel" role="tabpanel" aria-labelledby="tabRegister">
      <form id="registerForm" onsubmit="handleSignUp(event)">
        <label for="regEmail" data-i18n="emailLabel">Email Address</label>
        <input type="email" id="regEmail" data-i18n-placeholder="emailPlaceholder"
               placeholder="name@example.com" required>

        <label for="regPassword" data-i18n="passwordLabel">Password</label>
        <div style="position:relative;">
          <input type="password" id="regPassword" data-i18n-placeholder="regPasswordPlaceholder"
                 placeholder="At least 8 characters" required minlength="8" style="padding-right:44px;">
          <button type="button" onclick="togglePassword('regPassword','regEyeBtn')" id="regEyeBtn"
                  aria-label="Show password"
                  style="position:absolute;right:0;top:0;height:100%;width:42px;background:none;
                         border:none;cursor:pointer;font-size:18px;color:#666;display:flex;
                         align-items:center;justify-content:center;margin:0;padding:0;">👁</button>
        </div>

        <button type="submit" data-i18n="createAccountBtn">Create Account</button>
      </form>
    </div>

  </div><!-- /.container -->

  <script src="js/translations.js"></script>
  <script>
    // ── Apply saved language on load ──────────────────────────────
    (function() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.getElementById('langPicker').value = lang;
      applyTranslations(lang);
      _rebuildNavDropdown(lang);
    })();

    function navigateToPage(url) {
      if (url === 'signout') { handleSignOut(); return; }
      if (url) window.location.href = url;
    }
    function handleSignOut() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.')) keysToRemove.push(key);
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem('cognitoIdToken');
      localStorage.removeItem('cognitoAccessToken');
      window.location.href = 'signin.html';
    }

    const poolData = { UserPoolId: 'eu-west-2_BY54tpvV0', ClientId: '57hfik5lgckcarpu3qjoojmepf' };
    let userPool;
    if (typeof AmazonCognitoIdentity !== 'undefined') {
      userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    }

    function togglePassword(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn   = document.getElementById(btnId);
      const show  = input.type === 'password';
      input.type      = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
      btn.setAttribute('aria-label', show ? t('hidePasswordLabel') : t('showPasswordLabel'));
    }

    function switchTab(tab) {
      const isSignIn = tab === 'signin';
      document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
      document.getElementById('tabRegister').classList.toggle('active', !isSignIn);
      document.getElementById('panelSignIn').classList.toggle('active', isSignIn);
      document.getElementById('panelRegister').classList.toggle('active', !isSignIn);
      const el = document.getElementById('statusMessage');
      el.textContent = ''; el.style.display = 'none'; el.className = 'status-msg';
    }

    function showStatus(message, isError = false) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className   = 'status-msg ' + (isError ? 'error' : 'success');
      el.style.display = 'block';
    }

    function handleSignIn(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoadedMsg'), true); return; }
      const username = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: username, Password: password });
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: userPool });
      cognitoUser.authenticateUser(authDetails, {
        onSuccess(result) {
          localStorage.setItem('cognitoIdToken',     result.getIdToken().getJwtToken());
          localStorage.setItem('cognitoAccessToken', result.getAccessToken().getJwtToken());
          if (document.getElementById('rememberEmail').checked) {
            localStorage.setItem('rememberedEmail', username);
          } else { localStorage.removeItem('rememberedEmail'); }
          showStatus(t('signedInMsg'));
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        },
        onFailure(err) { showStatus(err.message || JSON.stringify(err), true); }
      });
    }

    function handleSignUp(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoadedMsg'), true); return; }
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const attributeList = [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })];
      userPool.signUp(email, password, attributeList, null, (err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('accountCreatedMsg'));
        setTimeout(() => { window.location.href = 'verify.html?email=' + encodeURIComponent(email); }, 1000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.') && key.endsWith('.idToken')) {
          window.location.replace('index.html'); return;
        }
      }
      if (localStorage.getItem('cognitoAccessToken') || localStorage.getItem('cognitoIdToken')) {
        window.location.replace('index.html');
      }
      const remembered = localStorage.getItem('rememberedEmail');
      if (remembered) {
        document.getElementById('siEmail').value = remembered;
        document.getElementById('rememberEmail').checked = true;
      }
    });
  </script>
</body>
</html>
