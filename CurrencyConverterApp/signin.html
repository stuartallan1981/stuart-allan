<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Register - Holiday Currency Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      width: 440px;
      max-width: 100%;
      text-align: center;
      overflow-y: auto;
      max-height: 95vh;
      box-sizing: border-box;
    }
    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .top-bar select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }
    .title-box {
      background-color: #007bff;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }
    .tab-row { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid #007bff; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; border: none; border-radius: 0; margin: 0; cursor: pointer; background: #fff; color: #007bff; transition: background 0.2s, color 0.2s; }
    .tab-btn.active { background: #007bff; color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    label { font-weight: bold; display: block; text-align: left; margin-top: 10px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s ease; }
    button:hover { background-color: #0056b3; }
    .status-msg { padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 15px; display: none; text-align: left; }
    .status-msg.error   { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <select class="lang-picker" id="langPicker" aria-label="Select language" onchange="setLang(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
      <select id="titleDropdown" onchange="navigateToPage(this.value)">
        <option value="signin.html"  data-i18n-nav="navSignInPage" selected>🔑 Sign In / Register</option>
        <option value="index.html"   data-i18n-nav="navHome">🏠 Home</option>
        <option value="contact.html" data-i18n-nav="navContact">✉️ Contact us</option>
        <option value="privacy.html" data-i18n-nav="navPrivacy">🔒 Privacy Policy</option>
        <option value="delete-account.html" data-i18n-nav="navDeleteAccount">🗑️ Delete Account</option>
        <option value="signout"      data-i18n-nav="navSignOut">🚪 Sign Out</option>
      </select>
    </div>

    <div class="title-box" data-i18n="appTitle">Holiday Currency Converter</div>

    <div class="tab-row" role="tablist">
      <button class="tab-btn active" id="tabSignIn" role="tab" aria-selected="true"
              aria-controls="panelSignIn" onclick="switchTab('signin')" data-i18n="tabSignIn">Sign In</button>
      <button class="tab-btn" id="tabRegister" role="tab" aria-selected="false"
              aria-controls="panelRegister" onclick="switchTab('register')" data-i18n="tabRegister">Register</button>
    </div>

    <div id="statusMessage" class="status-msg"></div>

    <div id="panelSignIn" class="tab-panel active" role="tabpanel" aria-labelledby="tabSignIn">
      <form id="signInForm" onsubmit="handleSignIn(event)">
        <label for="siEmail" data-i18n="emailLabel">Email Address</label>
        <input type="email" id="siEmail" data-i18n-placeholder="emailPlaceholder" placeholder="name@example.com" required>

        <label for="siPassword" data-i18n="passwordLabel">Password</label>
        <div style="position:relative;">
          <input type="password" id="siPassword" data-i18n-placeholder="signInPasswordPlaceholder"
                 placeholder="Enter password" required style="padding-right:44px;">
          <button type="button" onclick="togglePassword('siPassword','siEyeBtn')" id="siEyeBtn"
                  aria-label="Show password"
                  style="position:absolute;right:0;top:0;height:100%;width:42px;background:none;border:none;cursor:pointer;font-size:18px;color:#666;display:flex;align-items:center;justify-content:center;margin:0;padding:0;">👁</button>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;">
          <input type="checkbox" id="rememberEmail" style="width:18px;height:18px;margin:0;cursor:pointer;flex-shrink:0;">
          <label for="rememberEmail" style="margin:0;font-weight:normal;font-size:14px;cursor:pointer;" data-i18n="rememberEmail">Remember my email address</label>
        </div>

        <button type="submit" data-i18n="signInBtn">Sign In</button>
      </form>
    </div>

    <div id="panelRegister" class="tab-panel" role="tabpanel" aria-labelledby="tabRegister">
      <form id="registerForm" onsubmit="handleSignUp(event)">
        <label for="regEmail" data-i18n="emailLabel">Email Address</label>
        <input type="email" id="regEmail" data-i18n-placeholder="emailPlaceholder" placeholder="name@example.com" required>

        <label for="regPassword" data-i18n="passwordLabel">Password</label>
        <div style="position:relative;">
          <input type="password" id="regPassword" data-i18n-placeholder="regPasswordPlaceholder"
                 placeholder="At least 8 characters" required minlength="8" style="padding-right:44px;">
          <button type="button" onclick="togglePassword('regPassword','regEyeBtn')" id="regEyeBtn"
                  aria-label="Show password"
                  style="position:absolute;right:0;top:0;height:100%;width:42px;background:none;border:none;cursor:pointer;font-size:18px;color:#666;display:flex;align-items:center;justify-content:center;margin:0;padding:0;">👁</button>
        </div>

        <button type="submit" data-i18n="createAccountBtn">Create Account</button>
      </form>
    </div>

  </div>

  <script>
    const TRANSLATIONS = {
      en: { appTitle:'Holiday Currency Converter', tabSignIn:'Sign In', tabRegister:'Register', emailLabel:'Email Address', emailPlaceholder:'name@example.com', passwordLabel:'Password', signInPasswordPlaceholder:'Enter password', rememberEmail:'Remember my email address', signInBtn:'Sign In', regPasswordPlaceholder:'At least 8 characters', createAccountBtn:'Create Account', navHome:'🏠 Home', navContact:'✉️ Contact us', navPrivacy:'🔒 Privacy Policy', navDeleteAccount:'🗑️ Delete Account', navSignOut:'🚪 Sign Out', navSignInPage:'🔑 Sign In / Register', signedInMsg:'✅ Signed in successfully! Redirecting to Home page...', accountCreatedMsg:'✅ Registration successful! Redirecting to verification...', sdkNotLoadedMsg:'Cognito SDK not loaded. Check your internet connection.', showPasswordLabel:'Show password', hidePasswordLabel:'Hide password' },
      fr: { appTitle:'Convertisseur de Devises Vacances', tabSignIn:'Connexion', tabRegister:'Inscription', emailLabel:'Adresse e-mail', emailPlaceholder:'nom@exemple.com', passwordLabel:'Mot de passe', signInPasswordPlaceholder:'Entrez votre mot de passe', rememberEmail:'Se souvenir de mon adresse e-mail', signInBtn:'Se connecter', regPasswordPlaceholder:'Au moins 8 caractères', createAccountBtn:'Créer un compte', navHome:'🏠 Accueil', navContact:'✉️ Nous contacter', navPrivacy:'🔒 Politique de confidentialité', navDeleteAccount:'🗑️ Supprimer le compte', navSignOut:'🚪 Se déconnecter', navSignInPage:'🔑 Connexion / Inscription', signedInMsg:'✅ Connexion réussie ! Redirection...', accountCreatedMsg:'✅ Inscription réussie ! Redirection vers la vérification...', sdkNotLoadedMsg:'SDK Cognito non chargé. Vérifiez votre connexion Internet.', showPasswordLabel:'Afficher le mot de passe', hidePasswordLabel:'Masquer le mot de passe' },
      es: { appTitle:'Conversor de Divisas para Vacaciones', tabSignIn:'Iniciar sesión', tabRegister:'Registrarse', emailLabel:'Dirección de correo electrónico', emailPlaceholder:'nombre@ejemplo.com', passwordLabel:'Contraseña', signInPasswordPlaceholder:'Introduzca la contraseña', rememberEmail:'Recordar mi correo electrónico', signInBtn:'Iniciar sesión', regPasswordPlaceholder:'Al menos 8 caracteres', createAccountBtn:'Crear cuenta', navHome:'🏠 Inicio', navContact:'✉️ Contáctenos', navPrivacy:'🔒 Política de privacidad', navDeleteAccount:'🗑️ Eliminar cuenta', navSignOut:'🚪 Cerrar sesión', navSignInPage:'🔑 Iniciar sesión / Registrarse', signedInMsg:'✅ ¡Sesión iniciada! Redirigiendo...', accountCreatedMsg:'✅ ¡Registro exitoso! Redirigiendo a la verificación...', sdkNotLoadedMsg:'SDK de Cognito no cargado. Compruebe su conexión.', showPasswordLabel:'Mostrar contraseña', hidePasswordLabel:'Ocultar contraseña' },
      de: { appTitle:'Urlaubs-Währungsrechner', tabSignIn:'Anmelden', tabRegister:'Registrieren', emailLabel:'E-Mail-Adresse', emailPlaceholder:'name@beispiel.de', passwordLabel:'Passwort', signInPasswordPlaceholder:'Passwort eingeben', rememberEmail:'E-Mail-Adresse merken', signInBtn:'Anmelden', regPasswordPlaceholder:'Mindestens 8 Zeichen', createAccountBtn:'Konto erstellen', navHome:'🏠 Startseite', navContact:'✉️ Kontakt', navPrivacy:'🔒 Datenschutzrichtlinie', navDeleteAccount:'🗑️ Konto löschen', navSignOut:'🚪 Abmelden', navSignInPage:'🔑 Anmelden / Registrieren', signedInMsg:'✅ Erfolgreich angemeldet! Weiterleitung...', accountCreatedMsg:'✅ Registrierung erfolgreich! Weiterleitung zur Verifizierung...', sdkNotLoadedMsg:'Cognito SDK nicht geladen. Überprüfen Sie Ihre Internetverbindung.', showPasswordLabel:'Passwort anzeigen', hidePasswordLabel:'Passwort verbergen' },
      it: { appTitle:'Convertitore di Valute per Vacanze', tabSignIn:'Accedi', tabRegister:'Registrati', emailLabel:'Indirizzo email', emailPlaceholder:'nome@esempio.it', passwordLabel:'Password', signInPasswordPlaceholder:'Inserisci la password', rememberEmail:'Ricorda il mio indirizzo email', signInBtn:'Accedi', regPasswordPlaceholder:'Almeno 8 caratteri', createAccountBtn:'Crea account', navHome:'🏠 Home', navContact:'✉️ Contattaci', navPrivacy:'🔒 Informativa sulla privacy', navDeleteAccount:'🗑️ Elimina account', navSignOut:'🚪 Esci', navSignInPage:'🔑 Accedi / Registrati', signedInMsg:'✅ Accesso effettuato! Reindirizzamento...', accountCreatedMsg:'✅ Registrazione riuscita! Reindirizzamento alla verifica...', sdkNotLoadedMsg:'SDK Cognito non caricato. Verifica la connessione Internet.', showPasswordLabel:'Mostra password', hidePasswordLabel:'Nascondi password' }
    };

    function getLang() { return localStorage.getItem('appLang') || 'en'; }
    function t(key) { const tbl = TRANSLATIONS[getLang()] || TRANSLATIONS.en; return tbl[key] !== undefined ? tbl[key] : (TRANSLATIONS.en[key] || key); }
    function applyTranslations(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (tbl[k] !== undefined) el.innerHTML = tbl[k]; });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (tbl[k] !== undefined) el.placeholder = tbl[k]; });
    }
    function _rebuildNavDropdown(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      const dd = document.getElementById('titleDropdown');
      if (!dd) return;
      const cur = dd.value;
      dd.querySelectorAll('option[data-i18n-nav]').forEach(opt => { const k = opt.getAttribute('data-i18n-nav'); if (tbl[k] !== undefined) opt.textContent = tbl[k]; });
      dd.value = cur;
    }
    function setLang(code) {
      localStorage.setItem('appLang', code);
      document.documentElement.lang = code;
      applyTranslations(code);
      document.querySelectorAll('.lang-picker').forEach(s => { s.value = code; });
      _rebuildNavDropdown(code);
    }

    (function() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.getElementById('langPicker').value = lang;
      applyTranslations(lang);
      _rebuildNavDropdown(lang);
    })();

    const poolData = { UserPoolId: 'eu-west-2_BY54tpvV0', ClientId: '57hfik5lgckcarpu3qjoojmepf' };
    let userPool;
    if (typeof AmazonCognitoIdentity !== 'undefined') { userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData); }

    function navigateToPage(url) {
      if (url === 'signout') { handleSignOut(); return; }
      if (url) window.location.href = url;
    }
    function handleSignOut() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.')) keysToRemove.push(key);
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem('cognitoIdToken');
      localStorage.removeItem('cognitoAccessToken');
      window.location.href = 'signin.html';
    }

    function togglePassword(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
      btn.setAttribute('aria-label', show ? t('hidePasswordLabel') : t('showPasswordLabel'));
    }

    function switchTab(tab) {
      const isSignIn = tab === 'signin';
      document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
      document.getElementById('tabRegister').classList.toggle('active', !isSignIn);
      document.getElementById('panelSignIn').classList.toggle('active', isSignIn);
      document.getElementById('panelRegister').classList.toggle('active', !isSignIn);
      const el = document.getElementById('statusMessage');
      el.textContent = ''; el.style.display = 'none'; el.className = 'status-msg';
    }

    function showStatus(message, isError = false) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'status-msg ' + (isError ? 'error' : 'success');
      el.style.display = 'block';
    }

    function handleSignIn(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoadedMsg'), true); return; }
      const username = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: username, Password: password });
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: username, Pool: userPool });
      cognitoUser.authenticateUser(authDetails, {
        onSuccess(result) {
          localStorage.setItem('cognitoIdToken', result.getIdToken().getJwtToken());
          localStorage.setItem('cognitoAccessToken', result.getAccessToken().getJwtToken());
          if (document.getElementById('rememberEmail').checked) { localStorage.setItem('rememberedEmail', username); }
          else { localStorage.removeItem('rememberedEmail'); }
          showStatus(t('signedInMsg'));
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        },
        onFailure(err) { showStatus(err.message || JSON.stringify(err), true); }
      });
    }

    function handleSignUp(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoadedMsg'), true); return; }
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const attributeList = [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })];
      userPool.signUp(email, password, attributeList, null, (err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('accountCreatedMsg'));
        setTimeout(() => { window.location.href = `verify.html?email=${encodeURIComponent(email)}`; }, 1000);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.') && key.endsWith('.idToken')) {
          window.location.replace('index.html'); return;
        }
      }
      if (localStorage.getItem('cognitoAccessToken') || localStorage.getItem('cognitoIdToken')) {
        window.location.replace('index.html');
      }
      const remembered = localStorage.getItem('rememberedEmail');
      if (remembered) {
        document.getElementById('siEmail').value = remembered;
        document.getElementById('rememberEmail').checked = true;
      }
    });
  </script>
</body>
</html>
