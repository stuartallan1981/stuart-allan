<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - Holiday Currency Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      width: 440px;
      text-align: center;
      overflow-y: auto;
      max-height: 95vh;
    }
    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .top-bar select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }
    .title-box {
      background-color: #007bff;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    label { font-weight: bold; display: block; text-align: left; margin-top: 10px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s ease; }
    button:hover { background-color: #0056b3; }
    .resend-btn { background-color: #6c757d; margin-top: 8px; }
    .resend-btn:hover { background-color: #5a6268; }
    .status-msg { padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 15px; display: none; text-align: left; }
    .status-msg.error   { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .nav-link-box { margin-top: 15px; font-size: 14px; }
    .nav-link-box a { color: #007bff; text-decoration: none; font-weight: bold; }
    .nav-link-box a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <select class="lang-picker" id="langPicker" aria-label="Select language" onchange="setLang(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
      <select id="titleDropdown" onchange="navigateToPage(this.value)">
        <option value="verify.html"  data-i18n-nav="navVerifyPage" selected>✅ Verify Email</option>
        <option value="index.html"   data-i18n-nav="navHome">🏠 Home</option>
        <option value="contact.html" data-i18n-nav="navContact">✉️ Contact us</option>
        <option value="privacy.html" data-i18n-nav="navPrivacy">🔒 Privacy Policy</option>
        <option value="delete-account.html" data-i18n-nav="navDeleteAccount">🗑️ Delete Account</option>
        <option value="signout"      data-i18n-nav="navSignOut">🚪 Sign Out</option>
      </select>
    </div>

    <div class="title-box" data-i18n="verifyTitle">Verify Email</div>

    <div id="statusMessage" class="status-msg"></div>

    <form id="verifyForm" onsubmit="handleVerification(event)">
      <label for="email" data-i18n="emailLabel">Email Address</label>
      <input type="email" id="email" data-i18n-placeholder="emailPlaceholder" placeholder="name@example.com" required>

      <label for="code" data-i18n="codeLabel">Verification Code</label>
      <input type="text" id="code" data-i18n-placeholder="codePlaceholder" placeholder="Enter 6-digit code" required autofocus>

      <button type="submit" data-i18n="verifyBtn">Verify Account</button>
      <button type="button" class="resend-btn" onclick="resendCode()" data-i18n="resendBtn">Resend Verification Code</button>
    </form>

    <p style="margin-top:14px; font-size:13px; color:#666; text-align:center;" data-i18n="spamHint">
      📬 Can't find the code? Check your <strong>spam or junk folder</strong> — it sometimes ends up there.
    </p>

    <div class="nav-link-box">
      <span data-i18n="alreadyVerified">Already verified?</span>
      <a href="signin.html" data-i18n="signInLink">Sign In</a>
    </div>

  </div>

  <script>
    const TRANSLATIONS = {
      en: { verifyTitle:'Verify Email', emailLabel:'Email Address', emailPlaceholder:'name@example.com', codeLabel:'Verification Code', codePlaceholder:'Enter 6-digit code', verifyBtn:'Verify Account', resendBtn:'Resend Verification Code', spamHint:'📬 Can\'t find the code? Check your <strong>spam or junk folder</strong> — it sometimes ends up there.', alreadyVerified:'Already verified?', signInLink:'Sign In', navHome:'🏠 Home', navContact:'✉️ Contact us', navPrivacy:'🔒 Privacy Policy', navDeleteAccount:'🗑️ Delete Account', navSignOut:'🚪 Sign Out', navVerifyPage:'✅ Verify Email', verifiedMsg:'✅ Email verified successfully! Redirecting to Sign-In page...', enterEmailFirst:'Please enter your email address to resend the code.', codeResent:'📩 Verification code resent! Check your inbox.', sdkNotLoaded2:'Cognito SDK not loaded. Check your internet connection.' },
      fr: { verifyTitle:'Vérifier l\'e-mail', emailLabel:'Adresse e-mail', emailPlaceholder:'nom@exemple.com', codeLabel:'Code de vérification', codePlaceholder:'Entrez le code à 6 chiffres', verifyBtn:'Vérifier le compte', resendBtn:'Renvoyer le code de vérification', spamHint:'📬 Vous ne trouvez pas le code ? Vérifiez votre <strong>dossier spam ou courrier indésirable</strong>.', alreadyVerified:'Déjà vérifié ?', signInLink:'Se connecter', navHome:'🏠 Accueil', navContact:'✉️ Nous contacter', navPrivacy:'🔒 Politique de confidentialité', navDeleteAccount:'🗑️ Supprimer le compte', navSignOut:'🚪 Se déconnecter', navVerifyPage:'✅ Vérifier l\'e-mail', verifiedMsg:'✅ E-mail vérifié ! Redirection vers la connexion...', enterEmailFirst:'Veuillez d\'abord saisir votre adresse e-mail.', codeResent:'📩 Code de vérification renvoyé ! Vérifiez votre boîte de réception.', sdkNotLoaded2:'SDK Cognito non chargé. Vérifiez votre connexion Internet.' },
      es: { verifyTitle:'Verificar correo electrónico', emailLabel:'Dirección de correo electrónico', emailPlaceholder:'nombre@ejemplo.com', codeLabel:'Código de verificación', codePlaceholder:'Introduzca el código de 6 dígitos', verifyBtn:'Verificar cuenta', resendBtn:'Reenviar código de verificación', spamHint:'📬 ¿No encuentra el código? Revise su <strong>carpeta de spam o correo no deseado</strong>.', alreadyVerified:'¿Ya verificado?', signInLink:'Iniciar sesión', navHome:'🏠 Inicio', navContact:'✉️ Contáctenos', navPrivacy:'🔒 Política de privacidad', navDeleteAccount:'🗑️ Eliminar cuenta', navSignOut:'🚪 Cerrar sesión', navVerifyPage:'✅ Verificar correo', verifiedMsg:'✅ ¡Correo verificado! Redirigiendo al inicio de sesión...', enterEmailFirst:'Por favor, introduzca primero su correo electrónico.', codeResent:'📩 ¡Código reenviado! Revise su bandeja de entrada.', sdkNotLoaded2:'SDK de Cognito no cargado. Compruebe su conexión.' },
      de: { verifyTitle:'E-Mail bestätigen', emailLabel:'E-Mail-Adresse', emailPlaceholder:'name@beispiel.de', codeLabel:'Bestätigungscode', codePlaceholder:'6-stelligen Code eingeben', verifyBtn:'Konto verifizieren', resendBtn:'Bestätigungscode erneut senden', spamHint:'📬 Code nicht gefunden? Schauen Sie in Ihren <strong>Spam- oder Junk-Ordner</strong>.', alreadyVerified:'Bereits verifiziert?', signInLink:'Anmelden', navHome:'🏠 Startseite', navContact:'✉️ Kontakt', navPrivacy:'🔒 Datenschutzrichtlinie', navDeleteAccount:'🗑️ Konto löschen', navSignOut:'🚪 Abmelden', navVerifyPage:'✅ E-Mail bestätigen', verifiedMsg:'✅ E-Mail bestätigt! Weiterleitung zur Anmeldung...', enterEmailFirst:'Bitte geben Sie zuerst Ihre E-Mail-Adresse ein.', codeResent:'📩 Bestätigungscode erneut gesendet! Prüfen Sie Ihren Posteingang.', sdkNotLoaded2:'Cognito SDK nicht geladen. Überprüfen Sie Ihre Internetverbindung.' },
      it: { verifyTitle:'Verifica email', emailLabel:'Indirizzo email', emailPlaceholder:'nome@esempio.it', codeLabel:'Codice di verifica', codePlaceholder:'Inserisci il codice a 6 cifre', verifyBtn:'Verifica account', resendBtn:'Invia di nuovo il codice', spamHint:'📬 Non trovi il codice? Controlla la tua <strong>cartella spam o posta indesiderata</strong>.', alreadyVerified:'Già verificato?', signInLink:'Accedi', navHome:'🏠 Home', navContact:'✉️ Contattaci', navPrivacy:'🔒 Informativa sulla privacy', navDeleteAccount:'🗑️ Elimina account', navSignOut:'🚪 Esci', navVerifyPage:'✅ Verifica email', verifiedMsg:'✅ Email verificata! Reindirizzamento all\'accesso...', enterEmailFirst:'Inserisci prima il tuo indirizzo email.', codeResent:'📩 Codice inviato di nuovo! Controlla la tua casella di posta.', sdkNotLoaded2:'SDK Cognito non caricato. Verifica la connessione Internet.' }
    };

    function getLang() { return localStorage.getItem('appLang') || 'en'; }
    function t(key) { const tbl = TRANSLATIONS[getLang()] || TRANSLATIONS.en; return tbl[key] !== undefined ? tbl[key] : (TRANSLATIONS.en[key] || key); }
    function applyTranslations(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (tbl[k] !== undefined) el.innerHTML = tbl[k]; });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (tbl[k] !== undefined) el.placeholder = tbl[k]; });
    }
    function _rebuildNavDropdown(lang) {
      const tbl = TRANSLATIONS[lang] || TRANSLATIONS.en;
      const dd = document.getElementById('titleDropdown');
      if (!dd) return;
      const cur = dd.value;
      dd.querySelectorAll('option[data-i18n-nav]').forEach(opt => { const k = opt.getAttribute('data-i18n-nav'); if (tbl[k] !== undefined) opt.textContent = tbl[k]; });
      dd.value = cur;
    }
    function setLang(code) {
      localStorage.setItem('appLang', code);
      document.documentElement.lang = code;
      applyTranslations(code);
      document.querySelectorAll('.lang-picker').forEach(s => { s.value = code; });
      _rebuildNavDropdown(code);
    }

    (function() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.getElementById('langPicker').value = lang;
      applyTranslations(lang);
      _rebuildNavDropdown(lang);
    })();

    const poolData = { UserPoolId: 'eu-west-2_BY54tpvV0', ClientId: '57hfik5lgckcarpu3qjoojmepf' };
    let userPool;
    if (typeof AmazonCognitoIdentity !== 'undefined') { userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData); }

    window.addEventListener('DOMContentLoaded', () => {
      const emailParam = new URLSearchParams(window.location.search).get('email');
      if (emailParam) { document.getElementById('email').value = emailParam; }
    });

    function navigateToPage(url) {
      if (url === 'signout') { handleSignOut(); return; }
      if (url) window.location.href = url;
    }
    function handleSignOut() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.')) keysToRemove.push(key);
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem('cognitoIdToken');
      localStorage.removeItem('cognitoAccessToken');
      window.location.href = 'signin.html';
    }

    function showStatus(message, isError = false) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'status-msg ' + (isError ? 'error' : 'success');
      el.style.display = 'block';
    }

    function handleVerification(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoaded2'), true); return; }
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('code').value.trim();
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      cognitoUser.confirmRegistration(code, true, (err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('verifiedMsg'));
        setTimeout(() => { window.location.href = 'signin.html'; }, 1500);
      });
    }

    function resendCode() {
      if (!userPool) { showStatus(t('sdkNotLoaded2'), true); return; }
      const email = document.getElementById('email').value.trim();
      if (!email) { showStatus(t('enterEmailFirst'), true); return; }
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      cognitoUser.resendConfirmationCode((err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('codeResent'));
      });
    }
  </script>
</body>
</html>
