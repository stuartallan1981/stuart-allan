<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - Holiday Currency Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      width: 440px;
      text-align: center;
      overflow-y: auto;
      max-height: 95vh;
    }
    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 15px;
      gap: 8px;
    }
    .top-bar select {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }
    .title-box {
      background-color: #007bff;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: underline;
      letter-spacing: 0.5px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    label { font-weight: bold; display: block; text-align: left; margin-top: 10px; font-size: 14px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s ease; }
    button:hover { background-color: #0056b3; }
    .resend-btn { background-color: #6c757d; margin-top: 8px; }
    .resend-btn:hover { background-color: #5a6268; }
    .status-msg { padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 15px; display: none; text-align: left; }
    .status-msg.error   { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .nav-link-box { margin-top: 15px; font-size: 14px; }
    .nav-link-box a { color: #007bff; text-decoration: none; font-weight: bold; }
    .nav-link-box a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <select class="lang-picker" id="langPicker" aria-label="Select language" onchange="setLang(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
      </select>
      <select id="titleDropdown" onchange="navigateToPage(this.value)">
        <option value="verify.html"  data-i18n-nav="navVerifyPage" selected>✅ Verify Email</option>
        <option value="index.html"   data-i18n-nav="navHome">🏠 Home</option>
        <option value="contact.html" data-i18n-nav="navContact">✉️ Contact us</option>
        <option value="privacy.html" data-i18n-nav="navPrivacy">🔒 Privacy Policy</option>
        <option value="signout"      data-i18n-nav="navSignOut">🚪 Sign Out</option>
      </select>
    </div>

    <div class="title-box" data-i18n="verifyTitle">Verify Email</div>

    <div id="statusMessage" class="status-msg"></div>

    <form id="verifyForm" onsubmit="handleVerification(event)">
      <label for="email" data-i18n="emailLabel">Email Address</label>
      <input type="email" id="email" data-i18n-placeholder="emailPlaceholder"
             placeholder="name@example.com" required>

      <label for="code" data-i18n="codeLabel">Verification Code</label>
      <input type="text" id="code" data-i18n-placeholder="codePlaceholder"
             placeholder="Enter 6-digit code" required autofocus>

      <button type="submit" data-i18n="verifyBtn">Verify Account</button>
      <button type="button" class="resend-btn" onclick="resendCode()"
              data-i18n="resendBtn">Resend Verification Code</button>
    </form>

    <p style="margin-top:14px; font-size:13px; color:#666; text-align:center;"
       data-i18n="spamHint">
      📬 Can't find the code? Check your <strong>spam or junk folder</strong> — it sometimes ends up there.
    </p>

    <div class="nav-link-box">
      <span data-i18n="alreadyVerified">Already verified?</span>
      <a href="signin.html" data-i18n="signInLink">Sign In</a>
    </div>

  </div><!-- /.container -->

  <script src="js/translations.js"></script>
  <script>
    // ── Apply saved language on load ──────────────────────────────
    (function() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.getElementById('langPicker').value = lang;
      applyTranslations(lang);
      _rebuildNavDropdown(lang);
    })();

    function navigateToPage(url) {
      if (url === 'signout') { handleSignOut(); return; }
      if (url) window.location.href = url;
    }
    function handleSignOut() {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('CognitoIdentityServiceProvider.')) keysToRemove.push(key);
      }
      keysToRemove.forEach(k => localStorage.removeItem(k));
      localStorage.removeItem('cognitoIdToken');
      localStorage.removeItem('cognitoAccessToken');
      window.location.href = 'signin.html';
    }

    const poolData = { UserPoolId: 'eu-west-2_BY54tpvV0', ClientId: '57hfik5lgckcarpu3qjoojmepf' };
    let userPool;
    if (typeof AmazonCognitoIdentity !== 'undefined') {
      userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const emailParam = new URLSearchParams(window.location.search).get('email');
      if (emailParam) { document.getElementById('email').value = emailParam; }
    });

    function showStatus(message, isError = false) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className   = 'status-msg ' + (isError ? 'error' : 'success');
      el.style.display = 'block';
    }

    function handleVerification(event) {
      event.preventDefault();
      if (!userPool) { showStatus(t('sdkNotLoaded2'), true); return; }
      const email = document.getElementById('email').value.trim();
      const code  = document.getElementById('code').value.trim();
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      cognitoUser.confirmRegistration(code, true, (err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('verifiedMsg'));
        setTimeout(() => { window.location.href = 'signin.html'; }, 1500);
      });
    }

    function resendCode() {
      if (!userPool) { showStatus(t('sdkNotLoaded2'), true); return; }
      const email = document.getElementById('email').value.trim();
      if (!email) { showStatus(t('enterEmailFirst'), true); return; }
      const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
      cognitoUser.resendConfirmationCode((err) => {
        if (err) { showStatus(err.message || JSON.stringify(err), true); return; }
        showStatus(t('codeResent'));
      });
    }
  </script>
</body>
</html>
